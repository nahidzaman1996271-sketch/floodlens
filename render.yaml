services:
  - type: web
    name: floodlens-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn floodlens.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
